name: On push checks

on:
  push:
    branches:
      - "**"

jobs:
  checks:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun test
      - run: bun format
      - run: bun lint
      - run: bun run build
