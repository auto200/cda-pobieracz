<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDA Pobieracz</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #121212;
        color: #eee;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #root {
        width: min(700px, 100%);
        margin: 0 auto;
      }

      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }

      .progress-section {
        margin-bottom: 20px;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        font-size: 14px;
      }

      .progress-value {
        color: #aaa;
        font-variant-numeric: tabular-nums;
      }

      progress {
        width: 100%;
        height: 12px;
        display: block;
      }

      textarea {
        width: 100%;
        height: 300px;
        resize: vertical;
        padding: 12px;

        background: #0b0b0b;
        color: #ccc;
        border: 1px solid #333;
        border-radius: 6px;

        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
      }

      .download-btn {
        opacity: 0.5;
        cursor: pointer;
        border: 1px solid rgba(0, 0, 0, 0);
        border-radius: 4px;
        display: inline-block;
        font-weight: normal;
        line-height: 1.3343;
        padding: 8px 12px;
        text-align: center;
        vertical-align: middle;
        white-space: nowrap;
        border-color: #4e7600;
        font-size: 16px;
        margin-top: 5px;
        margin-bottom: 5px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          0 1px 2px rgba(0, 0, 0, 0.05);
        text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.25);
        text-decoration: none;
        color: #fff;
        background-color: #508401;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .download-icon {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <h1>CDA Pobieracz</h1>

      <div class="progress-section">
        <div class="progress-header">
          <span>Pobieranie video</span>
          <span id="video-progress-value" class="progress-value">0%</span>
        </div>

        <progress id="video-progress" value="0" max="100"></progress>
      </div>

      <div class="progress-section">
        <div class="progress-header">
          <span>Pobieranie audio</span>
          <span id="audio-progress-value" class="progress-value">0%</span>
        </div>

        <progress id="audio-progress" value="0" max="100"></progress>
      </div>

      <div class="progress-section">
        <div class="progress-header">
          <span>Renderowanie</span>
          <span id="render-progress-value" class="progress-value">0%</span>
        </div>

        <progress id="render-progress" value="0" max="100"></progress>
      </div>

      <div class="progress-section">
        <div class="progress-header">
          <span>Logi</span>
        </div>

        <textarea
          id="logs"
          readonly
          spellcheck="false"
          placeholder="Logi pojawią się tutaj..."
        ></textarea>
      </div>

      <div>
        <button class="download-btn" id="downloadButton" disabled>
          <svg class="download-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12"></path>
            <path d="m7 10 5 5 5-5"></path>
            <path d="M5 21h14"></path>
          </svg>
          Pobierz film
        </button>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
